name: "Check & Lint"

on:
  push:
    branches:
      - main
      - master
      - tests2
  pull_request:
    branches:
      - main
      - master
      - tests2

permissions:
  contents: read

jobs:
  check:
    name: Flake Check and Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Flake check
        run: nix flake check

      - name: Run Statix and Deadnix
        run: |
          nix shell --inputs-from . nixpkgs#statix nixpkgs#deadnix -c bash -c '
            echo "::group::Statix"
            statix check .
            echo "::endgroup::"

            echo "::group::Deadnix"
            deadnix .
            echo "::endgroup::"
          '

      - name: Validate settings.nix simplicity
        run: |
          echo "Checking settings.nix files for forbidden keywords (lib., let, mk)..."
          if grep -rnE "lib\.|let|mk" home-manager/hosts/*/settings.nix nixos/hosts/*/settings.nix; then
            echo "Error: settings.nix must contain only simple values without lib., let or mk!" >&2
            exit 1
          fi

