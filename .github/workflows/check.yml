name: "Check & Lint"

on:
  push:
    branches:
      - main
      - master
      - tests2
  pull_request:
    branches:
      - main
      - master
      - tests2

permissions:
  contents: read

jobs:
  check:
    name: Flake Check and Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Flake check
        run: nix flake check

      - name: Run Statix and Deadnix
        run: |
          nix shell --inputs-from . nixpkgs#statix nixpkgs#deadnix -c bash -c '
            echo "::group::Statix"
            statix check .
            echo "::endgroup::"

            echo "::group::Deadnix"
            deadnix .
            echo "::endgroup::"
          '

