services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - UMASK_SET=022 #optional
      # - JELLYFIN_PublishedServerUrl=192.168.0.5 #optional
      # - NVIDIA_VISIBLE_DEVICES=all
      # - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      - DOCKER_MODS=linuxserver/mods:jellyfin-opencl-intel
    volumes:
      - /home/dev/composes-data/jellyfin/data:/config

      - hd700_animes:/animes
      - hd700_movies:/movies
      - hd700_series:/series
      - nas1_movies:/movies1
      - nas1_tvshow:/series1
      - nas1_animes:/animes1
      - nas2_tvshow:/series2
      - nas2_movies:/movies2
      - nas2_animes:/animes2
    ports:
      - 8096:8096
      - 8920:8920 #optional
      - 7359:7359/udp #optional
      - 1900:1900/udp #optional
    mem_limit: 1200M
    mem_reservation: 300M
    cpus: 0.7
    devices:
      # - /dev/dri:/dev/dri
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card0:/dev/dri/card0
    restart: unless-stopped
volumes:
  hd700_animes:
    driver: local
    driver_opts:
      type: "cifs"
      o: "username=guest,vers=3.0,uid=1000,gid=1000,file_mode=0777,dir_mode=0777"
      device: "//10.10.10.1/700gb/Animes"
  hd700_movies:
    driver: local
    driver_opts:
      type: "cifs"
      o: "username=guest,vers=3.0,uid=1000,gid=1000,file_mode=0777,dir_mode=0777"
      device: "//10.10.10.1/700gb/Movies"
  hd700_series:
    driver: local
    driver_opts:
      type: "cifs"
      o: "username=guest,vers=3.0,uid=1000,gid=1000,file_mode=0777,dir_mode=0777"
      device: "//10.10.10.1/700gb/Tvshows"
  nas1_movies:
    driver_opts:
      type: nfs
      device: :/mnt/HD/HD_b2/Movies
      o: addr=10.10.10.226,rw,nfsvers=3,nolock,nosuid,noexec,nodev
  nas1_tvshow:
    driver_opts:
      type: nfs
      device: :/mnt/HD/HD_b2/TvShows
      o: addr=10.10.10.226,rw,nfsvers=3,nolock,nosuid,noexec,nodev
  nas1_animes:
    driver_opts:
      type: nfs
      device: :/mnt/HD/HD_b2/Animes
      o: addr=10.10.10.226,rw,nfsvers=3,nolock,nosuid,noexec,nodev
  nas2_movies:
    driver_opts:
      type: nfs
      device: :/mnt/HD/HD_a2/Transmission/Volume_2/Filmes
      o: addr=10.10.10.226,rw,nfsvers=3,nolock,nosuid,noexec,nodev
  nas2_tvshow:
    driver_opts:
      type: nfs
      device: :/mnt/HD/HD_a2/Transmission/Volume_2/Series
      o: addr=10.10.10.226,rw,nfsvers=3,nolock,nosuid,noexec,nodev
  nas2_animes:
    driver_opts:
      type: nfs
      device: :/mnt/HD/HD_a2/Transmission/Volume_2/Animes
      o: addr=10.10.10.226,rw,nfsvers=3,nolock,nosuid



