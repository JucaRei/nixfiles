###############
### General ###
###############

reset-on-next-file           = audio-delay,mute,pause,speed,sub-delay,video-aspect-override,video-pan-x,video-pan-y,video-rotate,video-zoom,volume
framedrop                    = no
cursor-autohide              = 1000   # autohide the curser after 1s
window-scale                 = 0.5    # Start the video window at half its normal size
# autofit-larger             = 90%x90%
# fs                         = yes    # Start playback in fullscreen mode
snap-window                  = yes    # Align the video window to screen edges when resizing or moving
alpha                        = blend  # Blend video with background when transparency is present
keep-open                    = always # Keep the window open after playback ends
save-position-on-quit        = yes    # Remember playback position when quitting
watch-later-options-remove   = pause
watch-later-directory        = '~/.cache/mpv/watch-later'
cache-dir                    = '~/.cache/mpv'

###################
### Screenshots ###
###################

screenshot-directory         = '~/Pictures/screenshots'
screenshot-format            = 'png'


############
# Playback #
############

deinterlace                  = no     # global reset of deinterlacing to off

#############
### VIDEO ###
#############

vo                           = gpu
# gpu-api                    = auto 
priority                     = normal # high
# gpu-context                = auto
hwdec                        = auto

##########
# Dither #
##########

dither-depth                 = auto
temporal-dither              = yes   # Enable temporal dithering (changes noise pattern over time)
dither                       = fruit

################
## HDR -> SDR ##
################

#tone-mapping=bt.2446a
#tone-mapping-mode=luma
#target-colorspace-hint=yes

################
### Language ###
################

slang                        = pt_BR,en,eng,de,deu,ger
demuxer-mkv-subtitle-preroll = "yes" # Forces showing subtitles while seeking through the video

#############
### Audio ###
#############

alang                        = ja,jp,jpn,jap,Japanese,en,eng,English
volume                       = 70       # Default volume
audio-delay                  = '+0.084' # Useful if you're watching with your headphones on PC, but output the video on your Television with a long HDMI cable (counter the delay)

########################
### Subtitle Styling ###
########################

sub-font                     = "Dubai"
sub-font-size                = 38
sub-color                    = "#FFFFFFFF" # White text
sub-border-color             = "#7282D9"   # Blue outline
sub-border-size              = 1
sub-shadow-offset            = 1
sub-shadow-color             = "#33000000" # Subtle shadow
sub-spacing                  = 0.5

##########################
### Subtitle Behaviour ###
##########################

sub-auto                     = fuzzy
sub-fix-timing               = yes
blend-subtitles              = yes
sub-gauss                    = '1.0'
sub-gray                     = yes
sub-ass-vsfilter-blur-compat = yes    # Backward compatibility for vsfilter fansubs
sub-ass-override             = yes
sub-file-paths-append        = subtitles
sub-file-paths               = sub subs subtitles

##########################
### Playback Behaviour ###
##########################

volume-max                   = 150    # Allow boosting volume above 100%
audio-channels               = auto   # Auto channel layout
audio-pitch-correction       = yes    # Keeps pitch correct when changing speed
audio-normalize-downmix      = yes    # Normalizes loudness when downmixing
audio-file-auto              = fuzzy  # Auto-load external audio tracks
demuxer-mkv-subtitle-preroll = yes

###################################
### Dynamic audio normalization ###
###################################

af-add                       = 'dynaudnorm=g=5:f=250:r=0.9:p=0.5'

###############
### OSD/OSC ###
###############

osc                          = no  # disables the graphical playback controls (play/pause bar, buttons).
border                       = yes # window has a border (useful for resizing/moving).
osd-bar                      = no  # Disables the progress bar overlay when seeking or adjusting volume.
osd-bold                     = yes # Makes OSD text bold for better readability.
osd-font-size                = 32  # Sets OSD text size (volume, seek info, etc.) to 32px.
osd-font                     = 'FiraCode Nerd Font Mono Retina'
