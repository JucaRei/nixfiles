##############################################################################
# MPV Configuration — Gerido via Nix (nixfiles)
# https://mpv.io/manual/stable/#configuration-files
# Testado com mpv 0.41.0 / libplacebo v7 / FFmpeg 8.x
# Perfil de hardware [hw-preset] injetado pelo Nix por host (ver default.nix)
##############################################################################

###############
### General ###
###############

reset-on-next-file           = audio-delay,mute,pause,speed,sub-delay,video-aspect-override,video-pan-x,video-pan-y,video-rotate,video-zoom,volume

framedrop                    = no
cursor-autohide              = 1000         # Ocultar cursor após 1s
window-scale                 = 0.5          # Janela a 50% do tamanho nativo
snap-window                  = yes          # Alinhar janela às bordas do ecrã
keep-open                    = always       # Manter janela aberta após fim da reprodução
keep-open-pause              = no           # Não pausar no último frame
save-position-on-quit        = yes          # Guardar posição ao sair
watch-later-options-remove   = pause        # Não retomar em pausa
watch-later-directory        = ~/.cache/mpv/watch-later
ordered-chapters             = yes          # Suporte a capítulos ordenados (Matroska)
gpu-context                  = auto

###################
### Screenshots ###
###################

screenshot-directory         = ~/Pictures/screenshots
screenshot-format            = png
screenshot-png-compression   = 3

############
# Playback #
############

deinterlace                  = no

#############
### VIDEO ###
#############

# Base — sobrescrito pelo perfil [hw-preset] injetado pelo Nix
vo                           = gpu
gpu-api                      = auto
hwdec                        = auto-safe
video-sync                   = display-resample
correct-pts                  = yes

##########
# Dither #
##########

dither-depth                 = auto
temporal-dither              = yes
dither                       = fruit

#####################
# Motion Smoothing  #
#####################

# Descomente para activar interpolação (requer GPU potente)
# interpolation               = yes
# tscale                      = oversample

################
## HDR -> SDR ##
################

# Ativado manualmente via perfil [hdr-sdr] (atalho: Ctrl+t)
# tone-mapping                = bt.2446a
# target-colorspace-hint      = yes

################
### Caching  ###
################

cache                        = yes
demuxer-readahead-secs       = 5
demuxer-max-bytes            = 150MiB
demuxer-max-back-bytes       = 75MiB

################
### Language ###
################

slang                        = pt_BR,en,eng,de,deu,ger
demuxer-mkv-subtitle-preroll = yes

#############
### Audio ###
#############

alang                        = pt_BR,pt,ja,jp,jpn,jap,Japanese,en,eng,English
volume                       = 70
audio-delay                  = +0.084
volume-max                   = 150
audio-channels               = auto
audio-pitch-correction       = yes
audio-normalize-downmix      = yes
audio-file-auto              = fuzzy

###################################
### Dynamic audio normalization ###
###################################

# Nota: af usa a sintaxe @nome:filtro para permitir toggle via input.conf (af toggle @dynaudnorm)
af                           = @dynaudnorm:lavfi=[dynaudnorm=g=5:f=250:r=0.9:p=0.5]

########################
### Subtitle Styling ###
########################

sub-font                     = Dubai
sub-font-size                = 38
# Nota: cores com # precisam de aspas em mpv.conf (# sem aspas inicia comentário)
sub-color                    = "#FFFFFFFF"
sub-border-color             = "#7282D9"
sub-border-size              = 1
sub-shadow-offset            = 1
sub-shadow-color             = "#33000000"
sub-spacing                  = 0.5

##########################
### Subtitle Behaviour ###
##########################

sub-auto                     = fuzzy
sub-fix-timing               = yes
blend-subtitles              = yes
sub-gauss                    = 1.0
sub-gray                     = yes
# sub-ass-vsfilter-blur-compat foi removida no mpv ≥ 0.40; substituída por:
sub-ass-use-video-data       = all
sub-ass-override             = yes
sub-file-paths               = sub:subs:subtitles
sub-scale-by-window          = yes

###############
### Network ###
###############

ytdl                         = yes
ytdl-format                  = (webm,mkv,mp4)[height<=?1080][vcodec!=?av01]+bestaudio/best

###############
### OSD/OSC ###
###############

osc                          = no
border                       = yes
osd-bar                      = no
osd-bold                     = yes
osd-font-size                = 32
osd-font                     = FiraCode Nerd Font Mono Retina

##############################################################################
# Perfis
# O perfil [hw-preset] é gerado e injetado abaixo pelo Nix (por host).
# A linha `profile=hw-preset` no fim deste ficheiro activa-o.
##############################################################################

# ── Tone-mapping HDR → SDR ──────────────────────────────────────────────────
# tone-mapping-mode foi removida no mpv ≥ 0.41; usar apenas tone-mapping

[hdr-sdr]
profile-desc=Tone-map HDR to SDR
tone-mapping=bt.2446a
target-colorspace-hint=yes

# ── Streaming ────────────────────────────────────────────────────────────────

[protocol.http]
cache=yes
ytdl-format=(webm,mkv,mp4)[height<=?720]+bestaudio/best
ytdl-raw-options=ignore-config=,sub-lang=pt_BR en,write-auto-sub=
hls-bitrate=max
force-window=immediate

[protocol.https]
profile=protocol.http

# ── Extensões de ficheiro ────────────────────────────────────────────────────

[extension.gif]
cache=no
loop-file=yes

[extension.png]
profile=extension.gif
video-aspect-override=0

[extension.jpeg]
profile=extension.png

[extension.jpg]
profile=extension.png

[extension.webp]
profile=extension.gif
