##############################################################################
# MPV Configuration — Gerido via Nix (nixfiles)
# https://mpv.io/manual/stable/#configuration-files
# Perfil de hardware [hw-preset] injetado pelo Nix por host (ver default.nix)
##############################################################################

###############
### General ###
###############

# Restaura estas propriedades ao avançar para o próximo ficheiro na playlist
reset-on-next-file           = audio-delay,mute,pause,speed,sub-delay,video-aspect-override,video-pan-x,video-pan-y,video-rotate,video-zoom,volume

framedrop                    = no           # Não descartar frames (prioridade à qualidade)
cursor-autohide              = 1000         # Ocultar cursor após 1s
window-scale                 = 0.5          # Janela a 50% do tamanho nativo
snap-window                  = yes          # Alinhar janela às bordas do ecrã
alpha                        = blend        # Misturar transparência com fundo
keep-open                    = always       # Manter janela aberta após fim da reprodução
keep-open-pause              = no           # Não pausar no último frame
save-position-on-quit        = yes          # Guardar posição ao sair
watch-later-options-remove   = pause        # Não retomar em pausa
watch-later-directory        = ~/.cache/mpv/watch-later
cache-dir                    = ~/.cache/mpv
ordered-chapters             = yes          # Suporte a capítulos ordenados (Matroska)
gpu-context                  = auto         # Contexto GPU automático

###################
### Screenshots ###
###################

screenshot-directory         = ~/Pictures/screenshots
screenshot-format            = png
screenshot-png-compression   = 3           # 0=sem compressão, 9=máximo (3=bom equilíbrio)
screenshot-jpeg-quality      = 95

############
# Playback #
############

deinterlace                  = no           # Desligar deinterlace global (conteúdo moderno é progressivo)

#############
### VIDEO ###
#############

# Valores base — sobrescritos pelo perfil [hw-preset] injetado pelo Nix
vo                           = gpu
gpu-api                      = auto
hwdec                        = auto-safe
video-sync                   = display-resample   # Melhor sincronização de frames com o monitor
correct-pts                  = yes                # Correcção de PTS para melhor timing

##########
# Dither #
##########

dither-depth                 = auto
temporal-dither              = yes          # Alterna o padrão de ruído entre frames
dither                       = fruit

#####################
# Motion Smoothing  #
#####################

# Descomente para activar interpolação de movimento (requer GPU potente)
# interpolation               = yes
# tscale                      = oversample

################
## HDR -> SDR ##
################

# Ativado manualmente via perfil [hdr-sdr] (atalho: Ctrl+t)
# tone-mapping                = bt.2446a
# tone-mapping-mode           = luma
# target-colorspace-hint      = yes

################
### Caching  ###
################

cache                        = yes
demuxer-readahead-secs       = 5
demuxer-max-bytes            = 150MiB
demuxer-max-back-bytes       = 75MiB

################
### Language ###
################

slang                        = pt_BR,en,eng,de,deu,ger    # Prioridade de idioma para legendas
demuxer-mkv-subtitle-preroll = yes          # Mostrar legendas mesmo durante seeking

#############
### Audio ###
#############

alang                        = pt_BR,pt,ja,jp,jpn,jap,Japanese,en,eng,English
volume                       = 70           # Volume inicial
audio-delay                  = +0.084       # Compensação de latência (útil com HDMI longo)
volume-max                   = 150          # Permite amplificar acima de 100%
audio-channels               = auto
audio-pitch-correction       = yes          # Mantém o tom ao mudar a velocidade
audio-normalize-downmix      = yes          # Normaliza ao misturar canais
audio-file-auto              = fuzzy        # Carrega automaticamente ficheiros de áudio externos

###################################
### Dynamic audio normalization ###
###################################

# Sempre ativo em background; pode ser desligado com Ctrl+n (af-toggle)
af-add                       = dynaudnorm=g=5:f=250:r=0.9:p=0.5

########################
### Subtitle Styling ###
########################

sub-font                     = Dubai
sub-font-size                = 38
sub-color                    = #FFFFFFFF    # Texto branco
sub-border-color             = #7282D9      # Contorno azul-violeta
sub-border-size              = 1
sub-shadow-offset            = 1
sub-shadow-color             = #33000000    # Sombra subtil
sub-spacing                  = 0.5

##########################
### Subtitle Behaviour ###
##########################

sub-auto                     = fuzzy        # Carregar legenda com nome semelhante ao vídeo
sub-fix-timing               = yes
blend-subtitles              = yes
sub-gauss                    = 1.0          # Suavização da máscara de legenda
sub-gray                     = yes
sub-ass-vsfilter-blur-compat = yes          # Compatibilidade com fansubs VSFilter
sub-ass-override             = yes
sub-file-paths               = sub:subs:subtitles   # Pastas onde procurar legendas
sub-scale-by-window          = yes          # Escala a legenda proporcionalmente à janela

###############
### Network ###
###############

ytdl                         = yes
# Formato global para streaming — sobreponível nos perfis protocol.http/https
ytdl-format                  = (webm,mkv,mp4)[height<=?1080][vcodec!=?av01]+bestaudio/best

###############
### OSD/OSC ###
###############

osc                          = no           # Desativa o OSC interno (usamos uosc)
border                       = yes          # Janela com borda nativa
osd-bar                      = no           # Sem barra de progresso do OSD
osd-bold                     = yes
osd-font-size                = 32
osd-font                     = FiraCode Nerd Font Mono Retina

##############################################################################
# Perfis
# O perfil [hw-preset] é gerado e injetado abaixo pelo Nix (por host).
# A linha `profile=hw-preset` no fim deste ficheiro activa-o.
##############################################################################

# ── Tone-mapping HDR → SDR ──────────────────────────────────────────────────

[hdr-sdr]
profile-desc=Tone-map HDR to SDR
tone-mapping=bt.2446a
tone-mapping-mode=luma
target-colorspace-hint=yes

# ── Streaming ────────────────────────────────────────────────────────────────

[protocol.http]
cache=yes
ytdl-format=(webm,mkv,mp4)[height<=?720]+bestaudio/best
ytdl-raw-options=ignore-config=,sub-lang=pt_BR en,write-auto-sub=
hls-bitrate=max
force-window=immediate

[protocol.https]
profile=protocol.http

# ── Extensões de ficheiro ────────────────────────────────────────────────────

[extension.gif]
cache=no
loop-file=yes

[extension.png]
profile=extension.gif
video-aspect-override=0

[extension.jpeg]
profile=extension.png

[extension.jpg]
profile=extension.png

[extension.webp]
profile=extension.gif
