# Basic playback controls
SPACE        cycle pause            # Space toggles play/pause
q            quit                   # q quits mpv
Q            quit-watch-later       # Q quits and saves position

# Seeking
LEFT         seek -5                # Left arrow: rewind 5 seconds
RIGHT        seek 5                 # Right arrow: forward 5 seconds
UP           seek 60                # Up arrow: forward 1 minute
DOWN         seek -60               # Down arrow: rewind 1 minute
Shift+RIGHT  no-osd seek 1 exact
Shift+LEFT   no-osd seek -1 exact
Shift+UP     no-osd seek 5 exact
Shift+DOWN   no-osd seek -5 exact

### Audio
WHEEL_UP     add volume 2
WHEEL_DOWN   add volume -2
+            add audio-delay 0.100
-            add audio-delay -0.100

# Volume
0            set volume 150         # 0 sets volume to 100%
9            add volume -5          # 9 decreases volume by 5
0            add volume +5          # 0 increases volume by 5

# Font size
CTRL++       add sub-font-size 1
CTRL+-       add sub-font-size -1
KP7	         add sub-scale -0.05
KP8	         set sub-scale 1.0
KP9	         add sub-scale +0.05

# Subtitles
s            cycle sub              # s toggles subtitles on/off
S            cycle sub-visibility   # S toggles subtitle visibility
z            sub-delay -0.1         # z decreases subtitle delay
x            sub-delay +0.1         # x increases subtitle delay

# Screenshots
screenshot   s                      # Press s to take a screenshot
Ctrl+s       screenshot video       # Ctrl+s saves raw video frame

# Playlist navigation
PGUP         playlist-prev          # Page Up goes to previous file in playlist
PGDWN        playlist-next          # Page Down goes to next file in playlist

# Speed control
[            add speed -0.1         # [ slows playback by 10%
]            add speed +0.1         # ] speeds playback by 10%
Backspace    set speed 1.0          # Backspace resets speed to normal