##############################################################################
# MPV Input Configuration — Gerido via Nix (nixfiles)
# https://mpv.io/manual/stable/#input-conf
# Testado com mpv 0.41.0
#
# Formato: KEY    COMMAND    # Comentário
# Teclas especiais: UP DOWN LEFT RIGHT SPACE ESC ENTER PGUP PGDWN
#                   KP0-KP9 WHEEL_UP WHEEL_DOWN BS (Backspace) DEL
##############################################################################

# ── Reprodução ────────────────────────────────────────────────────────────────
SPACE        cycle pause                                   # Pausar / Retomar
q            quit                                          # Sair
Q            quit-watch-later                              # Sair e guardar posição
esc          quit                                          # Sair (ESC)

# ── Seeking ───────────────────────────────────────────────────────────────────
LEFT         seek -5                                       # Recuar 5s
RIGHT        seek 5                                        # Avançar 5s
UP           seek 60                                       # Avançar 1 minuto
DOWN         seek -60                                      # Recuar 1 minuto
Shift+RIGHT  no-osd seek 1 exact                          # Avançar 1s (exacto)
Shift+LEFT   no-osd seek -1 exact                         # Recuar 1s (exacto)
Shift+UP     no-osd seek 5 exact                          # Avançar 5s (exacto)
Shift+DOWN   no-osd seek -5 exact                         # Recuar 5s (exacto)

# ── Volume / Áudio ────────────────────────────────────────────────────────────
WHEEL_UP     add volume 2                                  # Scroll ↑: volume +2%
WHEEL_DOWN   add volume -2                                 # Scroll ↓: volume -2%
9            add volume -5                                 # Volume -5%
0            add volume +5                                 # Volume +5%
+            add audio-delay 0.100                        # Atraso áudio +100ms
-            add audio-delay -0.100                       # Atraso áudio -100ms

# ── Velocidade ────────────────────────────────────────────────────────────────
[            add speed -0.1                               # Velocidade -10%
]            add speed +0.1                               # Velocidade +10%
BS           set speed 1.0                                # Repor velocidade (Backspace = BS)

# ── Normalização de Áudio ──────────────────────────────────────────────────────
# Nota: sintaxe correta para mpv 0.41 é `af toggle @nome:filtro` (não af-toggle=)
# O filtro precisa estar definido em af= em mpv.conf para toggle por nome funcionar.
Ctrl+n       af toggle @dynaudnorm:lavfi=[dynaudnorm=g=5:f=250:r=0.9:p=0.5] #! Normalização dinâmica
Ctrl+m       af toggle @loudnorm:lavfi=[loudnorm=I=-16:TP=-3:LRA=4]         #! Loudnorm EBU R128

# ── Legendas — Seleção ────────────────────────────────────────────────────────
s            cycle sub                                    # Alternar faixa de legenda
S            cycle sub-visibility                         # Mostrar/ocultar legendas
Ctrl+l       cycle-values sub-lang pt_BR en eng de deu ger #! Ciclar idioma de legenda

# ── Legendas — Ajuste de Tempo ───────────────────────────────────────────────
# Nota: sub-delay é propriedade, não comando. Usar `add sub-delay` para alterar.
z            add sub-delay -0.1                           # Legenda -100ms
x            add sub-delay +0.1                           # Legenda +100ms
Alt+k        add sub-delay +1                             # Legenda +1s
Alt+1        add sub-delay -1                             # Legenda -1s

# ── Legendas — Ajuste de Tamanho ─────────────────────────────────────────────
CTRL++       add sub-font-size 1                          # Fonte maior
CTRL+-       add sub-font-size -1                         # Fonte menor
KP7          add sub-scale -0.05                          # Escala -5%
KP8          set sub-scale 1.0                            # Repor escala
KP9          add sub-scale +0.05                          # Escala +5%
Alt+h        add sub-scale +0.1                           # Escala +10%
Alt+j        add sub-scale -0.1                           # Escala -10%

# ── Screenshots ───────────────────────────────────────────────────────────────
Ctrl+s       screenshot video                             # Screenshot sem legendas
Ctrl+S       screenshot                                   # Screenshot com legendas

# ── Playlist ──────────────────────────────────────────────────────────────────
PGUP         playlist-prev                                # Ficheiro anterior
PGDWN        playlist-next                                # Ficheiro seguinte

# ── HDR / Cor / Vídeo ─────────────────────────────────────────────────────────
Ctrl+t       apply-profile hdr-sdr                       #! Tone-map HDR→SDR
B            cycle-values background "#000000" "#ffffff"  # Alternar fundo
