##############################################################################
# OSC (On-Screen Controller) — Configuração
# https://github.com/mpv-player/mpv/blob/master/player/lua/osc.lua
# Nota: OSC interno desativado (osc=no em mpv.conf); este ficheiro configura
# o OSC builtin caso seja reativado. Para uosc, ver uosc.conf.
##############################################################################

seekbarstyle=knob
seekbarkeyframes=no
seekrangestyle=slider
vidscale=no
deadzonesize=0.75
inmousemove=4
valign=0.9
timems=yes
scalewindowed=0.8
hidetimeout=300
layout=slimbox
